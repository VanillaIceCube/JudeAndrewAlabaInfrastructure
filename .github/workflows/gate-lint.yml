name: Infrastructure Lint Gate
on:
  workflow_call:
    outputs:
      log:
        description: Bounded diagnostic log for Lint Eastwood.
        value: ${{ jobs.lint.outputs.log }}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  lint:
    name: Infrastructure lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      log: ${{ steps.report.outputs.log }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .github/package.json
      - name: Set up locked Python tooling
        uses: ./.github/actions/setup-uv
      - name: Install locked workflow dependencies
        run: npm ci --prefix .github --ignore-scripts --no-audit --no-fund
      - name: Install verified actionlint
        shell: bash
        run: node .github/scripts/install-actionlint.js
      - name: Validate workflow, shell, Python and JavaScript
        id: lint
        continue-on-error: true
        shell: bash
        run: node .github/scripts/lint-infrastructure.js 2>&1 | tee "$RUNNER_TEMP/lint.log"
      - name: Report diagnostics
        id: report
        if: always()
        shell: bash
        run: node .github/scripts/summarize-check-log.js "$RUNNER_TEMP/lint.log" --summary-lines 120
      - name: Enforce lint result
        if: steps.lint.outcome != 'success'
        run: exit 1
      - name: Retain bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: infrastructure-${{ github.job }}-failure-diagnostics
          path: ${{ runner.temp }}/*.bounded.txt
          if-no-files-found: warn
          retention-days: 7
