name: AI Build Sheriff Review

on:
  workflow_call:
    inputs:
      lint_result:
        required: false
        type: string
      test_result:
        required: false
        type: string
      lint_infrastructure_status:
        required: false
        type: string
      lint_infrastructure_log:
        required: false
        type: string
      lint_automation_status:
        required: false
        type: string
      lint_automation_log:
        required: false
        type: string
      test_ingress_status:
        required: false
        type: string
      test_ingress_log:
        required: false
        type: string
      test_recovery_status:
        required: false
        type: string
      test_recovery_log:
        required: false
        type: string
      test_automation_status:
        required: false
        type: string
      test_automation_log:
        required: false
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
      LINT_EASTWOOD_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Lint Eastwood build sheriff review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create Lint Eastwood GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.LINT_EASTWOOD_APP_ID }}
          private-key: ${{ secrets.LINT_EASTWOOD_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Collect prior Lint Eastwood reviews
        uses: ./.github/actions/collect-prior-ai-reviews
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          persona_name: "Lint Eastwood"
          output_path: ${{ runner.temp }}/build-prior-reviews.json

      - name: Get PR diff
        id: pr-diff
        uses: ./.github/actions/get-pr-diff
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}

      - name: Build review context
        if: steps.pr-diff.outputs.truncated != 'true'
        shell: bash
        env:
          CONTEXT_PATH: ${{ runner.temp }}/build-review-context.txt
          DIFF_PATH: ${{ steps.pr-diff.outputs.linediff_path }}
          PRIOR_REVIEWS_PATH: ${{ runner.temp }}/build-prior-reviews.json
          LINT_RESULT: ${{ inputs.lint_result || 'unknown' }}
          TEST_RESULT: ${{ inputs.test_result || 'unknown' }}
          LINT_INFRASTRUCTURE_STATUS: ${{ inputs.lint_infrastructure_status || 'not-applicable' }}
          LINT_INFRASTRUCTURE_LOG: ${{ inputs.lint_infrastructure_log }}
          LINT_AUTOMATION_STATUS: ${{ inputs.lint_automation_status || 'not-applicable' }}
          LINT_AUTOMATION_LOG: ${{ inputs.lint_automation_log }}
          TEST_INGRESS_STATUS: ${{ inputs.test_ingress_status || 'not-applicable' }}
          TEST_INGRESS_LOG: ${{ inputs.test_ingress_log }}
          TEST_RECOVERY_STATUS: ${{ inputs.test_recovery_status || 'not-applicable' }}
          TEST_RECOVERY_LOG: ${{ inputs.test_recovery_log }}
          TEST_AUTOMATION_STATUS: ${{ inputs.test_automation_status || 'not-applicable' }}
          TEST_AUTOMATION_LOG: ${{ inputs.test_automation_log }}
        run: |
          {
            echo '=== BUILD, LINT, AND TEST EVIDENCE ==='
            printf 'lint_result: %s\n' "$LINT_RESULT"
            printf 'test_result: %s\n' "$TEST_RESULT"
            printf 'lint_infrastructure_status: %s\n' "$LINT_INFRASTRUCTURE_STATUS"
            printf 'lint_automation_status: %s\n' "$LINT_AUTOMATION_STATUS"
            printf 'test_ingress_status: %s\n' "$TEST_INGRESS_STATUS"
            printf 'test_recovery_status: %s\n' "$TEST_RECOVERY_STATUS"
            printf 'test_automation_status: %s\n' "$TEST_AUTOMATION_STATUS"
            echo
            echo '--- lint_infrastructure_log ---'
            printf '%s\n' "$LINT_INFRASTRUCTURE_LOG"
            echo
            echo '--- lint_automation_log ---'
            printf '%s\n' "$LINT_AUTOMATION_LOG"
            echo
            echo '--- test_ingress_log ---'
            printf '%s\n' "$TEST_INGRESS_LOG"
            echo
            echo '--- test_recovery_log ---'
            printf '%s\n' "$TEST_RECOVERY_LOG"
            echo
            echo '--- test_automation_log ---'
            printf '%s\n' "$TEST_AUTOMATION_LOG"
            echo
            echo '=== PRIOR LINT EASTWOOD REVIEWS ==='
            cat "$PRIOR_REVIEWS_PATH"
            echo
            echo '=== LINE-NUMBERED PULL REQUEST DIFF ==='
            cat "$DIFF_PATH"
          } > "$CONTEXT_PATH"

      - name: Call Lint Eastwood
        if: steps.pr-diff.outputs.truncated != 'true'
        id: openai
        uses: ./.github/actions/openai-chat
        with:
          api_key: ${{ secrets.OPENAI_API_KEY }}
          project_id: ${{ vars.OPENAI_PROJECT_ID }}
          diff_path: ${{ runner.temp }}/build-review-context.txt
          model: "gpt-5.6-luna"
          system_prompt: "You are Lint Eastwood, Infrastructure's AI Build Sheriff. Own lint failures, test failures, build/workflow failures, formatting/type-check style failures, and CI failure interpretation. Sound like a natural, dry build sheriff: plainspoken, confident, concise, and quietly wry. Let a light western touch color the summary without staging an entire scene. Avoid forced jokes and theatrical CI prose. Keep technical findings exact and trustworthy."
          prompt_prefix: |
            This repository owns shared ingress and app-release/v1. Preserve independent app releases, existing networks, exact Notoli proxy trust, immutable images, SQLite journal recovery, and explicit rollback. Owner approval is required for every merge and production operation. Reviewers never edit files, merge, or deploy.

            Review this pull request as Lint Eastwood, the AI Build Sheriff.

            Focus only on build, lint, test, formatting, type-check style, and CI failure interpretation. Do not perform general code review; Obi-Wan Code-nobi owns that. Do not aggregate CodeQL, Dependency Review, or malware findings; RoboCop owns those.
            Read your prior review history below before deciding what to publish. Do not repost previously reported findings unless the current check output or diff evidence changed. If there is nothing materially new to add and the event matches your latest review, set "unchanged" to true, write a fresh persona-specific summary that clearly states the unchanged verdict, and leave findings, evidence, actions, and comments empty.
            Lead with a clear, fresh verdict, then explain the build state in plain language. Add at most one brief western turn of phraseâ€”such as a trail, holdout, wanted notice, gate, or railroadâ€”only when it fits the current checks naturally.
            Favor dry confidence and concrete check results over theatrical performance. The personality should be recognizable but never forced; do not stage a scene or stack multiple western metaphors.
            Vary the opening and phrasing from prior reviews. Do not reuse a stock sentence, fixed catchphrase, or force a joke merely to sound in character.
            Technical findings and inline comments must remain direct and professional. Actions may carry a light sheriff-like flourish only when the required fix or rerun stays unambiguous.

            Return ONLY strict JSON:
            {
              "event": "APPROVE" | "REQUEST_CHANGES" | "COMMENT",
              "summary": "one or two complete verdict sentences with clear decision wording, a natural dry sheriff voice, and at most one light context-relevant western turn of phrase; optional inline bold; no Markdown heading",
              "unchanged": false,
              "findings": [
                { "path": "optional relative/file/path", "line": 123, "body": "body-level build finding that cannot or should not be inline" }
              ],
              "evidence": ["short lint, test, build, formatting, type-check, or CI fact that materially supports the verdict"],
              "actions": ["concrete fix or rerun required from the author"],
              "comments": [
                { "path": "relative/file/path", "line": 123, "body": "inline comment tied to a failed check and valid added line" }
              ]
            }

            Rules:
            - If any lint/test/build status is failure and the failure appears caused by the PR, return REQUEST_CHANGES.
            - Use COMMENT only when the failure source is unclear, external, or infrastructure-related.
            - If all lint/test/build statuses are success or not-applicable, return APPROVE with a concise clean-build summary.
            - Use only line numbers shown as "A<line>:" in the diff.
            - Represent each finding exactly once: use either "findings" or "comments", never both.
            - Add inline comments only when each comment is useful and tied to a valid added line. If no valid line applies, put the finding in "findings".
            - Clearly distinguish direct check output from your interpretation.
            - Use "evidence" only for check facts that materially justify the verdict; omit not-applicable checks unless they explain scope.
            - Use "actions" only when the author must fix or rerun something. Do not repeat the finding.
            - Put the complete verdict wording in "summary". Do not generate Markdown headings, bullet prefixes, or automation notes; the shared publisher owns section layout.
            - Inline comments should state the failing diagnostic, its blocking impact, and the required action in as few sentences as practical. Do not repeat the review summary or use emojis or jokes.

            Build evidence follows:

      - name: Publish Lint Eastwood native review
        if: steps.pr-diff.outputs.truncated != 'true'
        uses: ./.github/actions/publish-ai-review
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          review_json: ${{ steps.openai.outputs.content }}
          persona_name: "Lint Eastwood"

      - name: Publish incomplete Lint Eastwood review
        if: steps.pr-diff.outputs.truncated == 'true'
        uses: ./.github/actions/publish-ai-review
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          persona_name: "Lint Eastwood"
          review_json: |
            {
              "event": "COMMENT",
              "summary": "**Review incomplete; check failed.** This change is bigger than the byte budget in this town. I will not stamp a clean build on evidence I could not inspect from end to end.",
              "unchanged": false,
              "findings": [],
              "evidence": ["The complete diff is ${{ steps.pr-diff.outputs.diff_bytes }} bytes; my review budget is ${{ steps.pr-diff.outputs.max_bytes }} bytes."],
              "actions": ["Break the change into smaller pull requests or intentionally raise my reviewed diff budget, then send it back through."],
              "comments": []
            }

      - name: Fail incomplete Lint Eastwood review
        if: steps.pr-diff.outputs.truncated == 'true'
        shell: bash
        run: |
          echo "::error::Lint Eastwood could not review the complete pull-request diff."
          exit 1
