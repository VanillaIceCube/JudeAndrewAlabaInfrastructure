name: Validate infrastructure
on:
  workflow_call:
    outputs:
      ingress_status:
        description: Retired ingress test suite (not-applicable).
        value: ${{ jobs.validate.outputs.ingress_status }}
      ingress_log:
        description: Retired ingress suite description.
        value: ${{ jobs.validate.outputs.ingress_log }}
      recovery_status:
        description: Retired recovery test suites (not-applicable).
        value: ${{ jobs.validate.outputs.recovery_status }}
      recovery_log:
        description: Retired recovery suites description.
        value: ${{ jobs.validate.outputs.recovery_log }}
      automation_status:
        description: Automation regression status.
        value: ${{ jobs.validate.outputs.automation_status }}
      automation_log:
        description: Automation diagnostics.
        value: ${{ jobs.validate.outputs.automation_log }}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ingress_status: ${{ steps.ingress-report.outputs.ingress_status }}
      ingress_log: ${{ steps.ingress-report.outputs.ingress }}
      recovery_status: ${{ steps.recovery-report.outputs.recovery_status }}
      recovery_log: ${{ steps.recovery-report.outputs.recovery }}
      automation_status: ${{ steps.automation-report.outputs.automation_status }}
      automation_log: ${{ steps.automation-report.outputs.automation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Set up locked Python tooling
        uses: ./.github/actions/setup-uv
      - name: Verify shared release source manifest
        run: python3 app-release/update_release_manifest.py --check
      - name: Validate Compose configuration
        id: compose
        continue-on-error: true
        run: |
          set -o pipefail
          docker compose -f compose.yml config --quiet 2>&1 | tee "$RUNNER_TEMP/compose.log"

      - name: Validate action-local regressions
        id: automation
        continue-on-error: true
        run: |
          set -o pipefail
          {
            mapfile -t automation_tests < <(find .github/actions -name '*.test.js' -print)
            [ "${#automation_tests[@]}" -gt 0 ] || exit 1
            node --test "${automation_tests[@]}"
          } 2>&1 | tee "$RUNNER_TEMP/automation.log"
      - name: Bound Compose diagnostics
        if: always()
        run: python3 .github/tools/bounded_log.py "$RUNNER_TEMP/compose.log" "$RUNNER_TEMP/compose.outputs"
      - id: ingress-report
        if: always()
        run: |
          echo 'ingress_status=not-applicable' >> "$GITHUB_OUTPUT"
          echo 'ingress=Root ingress routing and reversal tests were retired; no runtime acceptance was performed.' >> "$GITHUB_OUTPUT"
      - id: recovery-report
        if: always()
        run: |
          echo 'recovery_status=not-applicable' >> "$GITHUB_OUTPUT"
          echo 'recovery=Root snapshot, gateway transaction and release-profile tests were retired; no recovery acceptance was performed.' >> "$GITHUB_OUTPUT"
      - id: automation-report
        if: always()
        env:
          OUTCOME: ${{ steps.automation.outcome }}
        run: |
          python3 .github/tools/bounded_log.py "$RUNNER_TEMP/automation.log" "$RUNNER_TEMP/automation.outputs"
          python3 .github/tools/ci_report.py automation "$RUNNER_TEMP/automation.summary.txt" "$OUTCOME"
      - name: Require every validation suite
        if: always() && (steps.compose.outcome != 'success' || steps.automation.outcome != 'success' || steps.automation-report.outcome != 'success')
        run: exit 1
      - name: Retain bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: infrastructure-${{ github.job }}-failure-diagnostics
          path: ${{ runner.temp }}/*.bounded.txt
          if-no-files-found: warn
          retention-days: 7
