name: fullstacktemplate
services:
  backend:
    image: ${BACKEND_IMAGE:?Set the reviewed backend digest}
    container_name: fullstacktemplate-backend
    restart: always
    env_file:
      - path: .backend.env
        format: raw
    volumes:
      - type: bind
        source: ${APP_DB_PATH:?Set the absolute existing SQLite file}
        target: /backend/db.sqlite3
        bind:
          create_host_path: false
    networks:
      ingress:
        aliases: [fullstacktemplate-backend]
      default:
        aliases: [backend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  frontend:
    image: ${FRONTEND_IMAGE:?Set the reviewed frontend digest}
    container_name: fullstacktemplate-frontend
    restart: always
    networks:
      ingress:
        aliases: [fullstacktemplate-frontend]
      default:
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  ingress: {external: true, name: fullstacktemplate-ingress}
  default: {external: true, name: fullstacktemplate_default}
