user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
# Nginx upstream errors can include the raw request URI (OAuth codes).
# Access logs below deliberately omit queries; request error logging is disabled.
error_log /dev/null;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe '$remote_addr $host $request_method $uri $status $body_bytes_sent $request_time';
  access_log /dev/stdout safe;
  sendfile on;
  keepalive_timeout 65;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  include /etc/nginx/conf.d/*.conf;
}
