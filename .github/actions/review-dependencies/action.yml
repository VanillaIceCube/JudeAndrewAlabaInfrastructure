name: Review dependency changes
description: Run GitHub Dependency Review and report a bounded summary of its findings.
outputs:
  report:
    description: The scanner result and a bounded summary for security review.
    value: ${{ steps.vulnerability-report.outputs.report }}
runs:
  using: composite
  steps:
    - name: Review vulnerable dependency changes
      id: dependency-review
      uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
      with:
        fail-on-severity: high
        comment-summary-in-pr: never

    - name: Write vulnerability report output
      id: vulnerability-report
      if: always()
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/review-dependencies.js" "$GITHUB_OUTPUT" <<'DEPENDENCY_REVIEW_JSON'
        {
          "outcome": ${{ toJSON(steps.dependency-review.outcome) }},
          "dependencyChanges": ${{ toJSON(steps.dependency-review.outputs.dependency-changes) }},
          "vulnerableChanges": ${{ toJSON(steps.dependency-review.outputs.vulnerable-changes) }}
        }
        DEPENDENCY_REVIEW_JSON
