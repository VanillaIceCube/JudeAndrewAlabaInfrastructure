name: host-ingress
services:
  proxy:
    image: nginx@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    container_name: host-ingress-proxy
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/vhosts:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ${INGRESS_CERTS_DIR:-/root/apps/notoli/certs}:/etc/nginx/certs:ro
    networks:
      notoli_backend:
        ipv4_address: 172.30.88.2
      notoli_frontend:
      macromapper:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  notoli_backend:
    external: true
    name: notoli_backend_private
  notoli_frontend:
    external: true
    name: notoli_default
  macromapper:
    external: true
    name: macromapper-ingress
