name: Deploy gateway
on:
  push:
    branches: [env-prod]
  workflow_dispatch:
    inputs:
      operation:
        description: Gateway operation (select env-prod above; rollback requires explicit authorization).
        type: choice
        options: [deploy, rollback]
        default: deploy
      recovery:
        description: For rollback, exact retained failed/current release ID from the host journal.
        type: string
        default: ''
concurrency:
  group: gateway-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/env-prod' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: gateway-approval
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate promotion policy and execute gateway transaction
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          GATEWAY_OPERATION: ${{ inputs.operation || 'deploy' }}
          GATEWAY_RECOVERY: ${{ inputs.recovery }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
        run: python3 scripts/gateway_transport.py
      - name: Record a failed or cancelled runner without asserting the running source
        if: always() && steps.release.outcome != 'success' && steps.release.outputs.deployment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GATEWAY_DEPLOYMENT_ID: ${{ steps.release.outputs.deployment }}
        run: python3 scripts/gateway_transport.py finalize-failure
