# Opt-in server-level include. The vhost owns $app_backend and exact Host trust.
location = /mcp {
  proxy_pass http://$app_backend$request_uri;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 120s;
  proxy_set_header Connection "";
  # A local proxy_set_header cancels inheritance of ALL parent headers.
  include /etc/nginx/snippets/headers.conf;
  include /etc/nginx/snippets/private.conf;
}
location ^~ /.well-known/ {
  proxy_pass http://$app_backend$request_uri;
  include /etc/nginx/snippets/private.conf;
}
