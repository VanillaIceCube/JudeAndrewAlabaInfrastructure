# Inactive: outside nginx.conf's vhost glob. Use only the approved YNAB overlay.
map $request_uri $ynab_exact_route {
  default 0;
  ~^/mcp$ 1;
  ~^/\.well-known/oauth-protected-resource/mcp$ 1;
}
server {
  listen 80;
  listen [::]:80;
  server_name ynab.judeandrewalaba.com;
  access_log off;
  add_header Cache-Control "no-store" always;
  if ($host != "ynab.judeandrewalaba.com") { return 421; }
  if ($ynab_exact_route = 0) { return 404; }
  return 301 https://ynab.judeandrewalaba.com$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name ynab.judeandrewalaba.com;
  include /etc/nginx/snippets/tls.conf;
  include /etc/nginx/snippets/ynab-headers.conf;
  include /etc/nginx/snippets/private.conf;
  access_log off;
  error_log /dev/null;
  if ($host != "ynab.judeandrewalaba.com") { return 421; }
  if ($ynab_exact_route = 0) { return 404; }
  client_body_timeout 5s;
  send_timeout 30s;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  set $ynab_backend ynab-mcp-gateway:8000;

  location = /mcp {
    client_max_body_size 256k;
    proxy_request_buffering off;
    proxy_pass http://$ynab_backend$request_uri;
    include /etc/nginx/snippets/mcp-transport.conf;
    include /etc/nginx/snippets/ynab-headers.conf;
    include /etc/nginx/snippets/private.conf;
  }
  location = /.well-known/oauth-protected-resource/mcp {
    client_max_body_size 256k;
    proxy_pass http://$ynab_backend$request_uri;
    include /etc/nginx/snippets/private.conf;
  }
  location / { return 404; }
}
