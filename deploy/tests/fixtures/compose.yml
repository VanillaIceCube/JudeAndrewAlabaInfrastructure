# App-only release: the shared gateway reaches both services without host ports.
# The bundle builder and release controller require reviewed immutable image digests.
name: release-fixture

services:
  backend:
    image: ${BACKEND_IMAGE:?Set the reviewed backend digest}
    container_name: release-fixture-backend
    restart: unless-stopped
    env_file:
      - path: .backend.env
        # Preserve literal dollar signs, hashes and quotes in private settings.
        format: raw
    volumes:
      - type: bind
        source: ${APP_DB_PATH:?Set the absolute existing SQLite file}
        target: /backend/db.sqlite3
        bind:
          # Require the existing SQLite file; never create a directory in its place.
          create_host_path: false
    networks:
      ingress:
        aliases:
          - release-fixture-backend
      default:
        aliases:
          - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:?Set the reviewed frontend digest}
    container_name: release-fixture-frontend
    restart: unless-stopped
    networks:
      ingress:
        aliases:
          - release-fixture-frontend
      default:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Infrastructure owns network creation and gateway membership; app.json owns policy.
networks:
  ingress:
    external: true
    name: release-fixture-ingress
  default:
    external: true
    name: release-fixture_default
