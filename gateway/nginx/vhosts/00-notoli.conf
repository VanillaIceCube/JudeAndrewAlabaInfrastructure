server {
  listen 80;
  listen [::]:80;
  server_name notoli.judeandrewalaba.com;
  return 301 https://notoli.judeandrewalaba.com$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name notoli.judeandrewalaba.com;
  include /etc/nginx/helpers/tls.conf;
  include /etc/nginx/helpers/headers.conf;
  set $app_backend notoli-backend:8000;
  set $app_frontend notoli-frontend:80;
  location ~ ^/(auth|api|admin)/ {
    include /etc/nginx/helpers/private-backend.conf;
  }
  include /etc/nginx/helpers/app-routes.conf;
}
