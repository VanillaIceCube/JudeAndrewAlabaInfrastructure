# Inactive gateway overlay: review/provision the new external network before use.
# Combine explicitly with compose.yml only in the separately approved gateway release.
services:
  proxy:
    volumes:
      - ./nginx/optional/ynab:/etc/nginx/conf.d:ro
      - ./nginx/vhosts:/etc/nginx/existing-vhosts:ro
    networks:
      ynab_route:
        ipv4_address: 172.30.89.2
networks:
  ynab_route:
    external: true
    name: ynab_mcp_private
