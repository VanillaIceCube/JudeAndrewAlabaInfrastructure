name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches-ignore:
      - env-prod
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lints:
    name: Lints
    uses: ./.github/workflows/gate-lint.yml
  tests:
    name: Tests
    uses: ./.github/workflows/gate-test.yml
    permissions:
      contents: read
      pull-requests: read
  codeql:
    name: CodeQL
    uses: ./.github/workflows/gate-codeql.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
  dependency-vulnerability:
    name: Vulnerability
    uses: ./.github/workflows/gate-vulnerability.yml
    permissions:
      contents: read
      pull-requests: read
  secrets:
    name: Secret scan
    uses: ./.github/workflows/gate-secrets.yml
  code-review:
    name: AI Code Review
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/review-code.yml
    secrets:
      OBI_WAN_OPENAI_API_KEY: ${{ secrets.OBI_WAN_OPENAI_API_KEY }}
      OBI_WAN_CODE_NOBI_PRIVATE_KEY: ${{ secrets.OBI_WAN_CODE_NOBI_PRIVATE_KEY }}
    permissions:
      statuses: read
      checks: read
      contents: read
      pull-requests: read
  build-review:
    name: AI Build Sheriff Review
    needs: [lints, tests]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/review-build.yml
    secrets:
      LINT_EASTWOOD_OPENAI_API_KEY: ${{ secrets.LINT_EASTWOOD_OPENAI_API_KEY }}
      LINT_EASTWOOD_PRIVATE_KEY: ${{ secrets.LINT_EASTWOOD_PRIVATE_KEY }}
    permissions:
      statuses: read
      checks: read
      contents: read
      pull-requests: read
    with:
      lint_result: ${{ needs.lints.result }}
      test_result: ${{ needs.tests.result }}
      lint_infrastructure_status: ${{ needs.lints.result }}
      lint_infrastructure_log: ${{ needs.lints.outputs.log }}
      test_ingress_status: ${{ needs.tests.outputs.ingress_status }}
      test_ingress_log: ${{ needs.tests.outputs.ingress_log }}
      test_recovery_status: ${{ needs.tests.outputs.recovery_status }}
      test_recovery_log: ${{ needs.tests.outputs.recovery_log }}
      test_automation_status: ${{ needs.tests.outputs.automation_status }}
      test_automation_log: ${{ needs.tests.outputs.automation_log }}
  security-review:
    name: AI Security Review
    needs: [codeql, dependency-vulnerability, secrets]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/review-security.yml
    secrets:
      ROBOCOP_OPENAI_API_KEY: ${{ secrets.ROBOCOP_OPENAI_API_KEY }}
      ROBOCOP_PRIVATE_KEY: ${{ secrets.ROBOCOP_PRIVATE_KEY }}
    permissions:
      statuses: read
      actions: read
      checks: read
      contents: read
      pull-requests: read
      security-events: read
    with:
      codeql_result: ${{ needs.codeql.result }}
      codeql_scope_status: ${{ needs.codeql.outputs.scope_status }}
      codeql_scope_python: ${{ needs.codeql.outputs.scope_python }}
      codeql_scope_javascript: ${{ needs.codeql.outputs.scope_javascript }}
      codeql_scope_actions: ${{ needs.codeql.outputs.scope_actions }}
      dependency_vulnerability_result: ${{ needs.dependency-vulnerability.result }}
      dependency_vulnerability_report: ${{ needs.dependency-vulnerability.outputs.vulnerability_report }}
      secret_scan_result: ${{ needs.secrets.result }}
  result:
    name: Required CI
    needs: [lints, tests, codeql, dependency-vulnerability, secrets, code-review, build-review, security-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require independent gates and applicable reviews
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python3 - <<'PY'
          """Fail closed unless all expected gates and applicable reviewers succeeded."""
          import json
          import os
          from pathlib import Path

          GATES = {"lints", "tests", "codeql", "dependency-vulnerability", "secrets"}
          REVIEWS = {"code-review", "build-review", "security-review"}


          def reviews_applicable(event, repository):
              """Human and Dependabot PRs from this repository require every reviewer."""
              head_repository = event.get("pull_request", {}).get("head", {}).get("repo") or {}
              return bool(repository and head_repository.get("full_name") == repository)


          def failures(results, reviews_applicable):
              problems = []
              for name in sorted(GATES | REVIEWS):
                  expected = "skipped" if name in REVIEWS and not reviews_applicable else "success"
                  result = results.get(name, {}).get("result", "missing")
                  if result != expected:
                      problems.append(f"{name}: {result} (expected {expected})")
              return problems


          if __name__ == "__main__":
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              applicable = reviews_applicable(event, os.environ["GITHUB_REPOSITORY"])
              problems = failures(json.loads(os.environ["RESULTS"]), applicable)
              if problems:
                  raise SystemExit("\n".join(problems))
              print("All independent gates and applicable reviews passed.")
          PY
