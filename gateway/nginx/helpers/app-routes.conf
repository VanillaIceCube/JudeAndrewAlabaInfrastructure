location = /mcp {
  proxy_pass http://$app_backend$request_uri;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 120s;
  proxy_set_header Connection "";
  # Setting Connection here requires repeating the server's forwarding headers.
  include /etc/nginx/helpers/headers.conf;
  include /etc/nginx/helpers/private-backend.conf;
}
location ^~ /.well-known/ {
  proxy_pass http://$app_backend$request_uri;
  include /etc/nginx/helpers/private-backend.conf;
}
location = /api { return 301 /api/; }
location = /auth { return 301 /auth/; }
location = /admin { return 301 /admin/; }
location ~ ^/static/(admin|rest_framework)/ {
  proxy_pass http://$app_backend$request_uri;
}
location / {
  proxy_pass http://$app_frontend$request_uri;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  include /etc/nginx/helpers/headers.conf;
}
