name: Test Gate

on:
  workflow_call:
    inputs:
      application:
        description: Run the application checks. Infrastructure selects its own checks with false.
        type: boolean
        required: true
    outputs:
      test_frontend_status:
        description: Frontend test status (success/failure/not-applicable).
        value: ${{ jobs.test-results.outputs.frontend_status }}
      test_frontend_log:
        description: Frontend test log tail.
        value: ${{ jobs.test-results.outputs.frontend_log }}
      test_backend_status:
        description: Backend test status (success/failure/not-applicable).
        value: ${{ jobs.test-results.outputs.backend_status }}
      test_backend_log:
        description: Backend test log tail.
        value: ${{ jobs.test-results.outputs.backend_log }}
      test_automation_status:
        description: Repository automation test status (success/failure/not-applicable).
        value: ${{ jobs.validate.outputs.automation_status || jobs.test-results.outputs.automation_status }}
      test_automation_log:
        description: Repository automation test log tail.
        value: ${{ jobs.validate.outputs.automation_log || jobs.test-results.outputs.automation_log }}
      test_ingress_status:
        description: Gateway topology, routing and Nginx syntax check status.
        value: ${{ jobs.validate.outputs.ingress_status }}
      test_ingress_log:
        description: Bounded gateway validation diagnostics.
        value: ${{ jobs.validate.outputs.ingress_log }}
      test_release_status:
        description: Canonical application launch regression status.
        value: ${{ jobs.validate.outputs.release_status }}
      test_release_log:
        description: Bounded application launch diagnostics.
        value: ${{ jobs.validate.outputs.release_log }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    if: inputs.application
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      automation: ${{ steps.filter.outputs.automation }}
      development: ${{ steps.filter.outputs.development }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0

      - name: Detect application changes
        id: filter
        continue-on-error: true
        uses: dorny/paths-filter@f3360c560367c9daf72b88c0e6164162034c5721 # v4
        with:
          filters: |
            frontend:
              - '.github/workflows/ci-orchestrator.yml'
              - 'frontend/**'
            backend:
              - '.github/workflows/ci-orchestrator.yml'
              - 'backend/**'
            development:
              - '.github/workflows/ci-orchestrator.yml'
              - 'backend/docker/Dockerfile.dockerignore'
              - 'backend/docker/Dockerfile.hotswap.dockerignore'
              - 'backend/docker/Dockerfile.hotswap'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - 'frontend/docker/Dockerfile.hotswap'
              - 'frontend/docker/Dockerfile.dockerignore'
              - 'frontend/docker/Dockerfile.hotswap.dockerignore'
              - 'frontend/package*.json'
            automation:
              - '.github/**'
              - 'backend/docker/**'
              - 'deploy/**'
              - 'docs/**'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'AGENTS.md'
              - 'LICENSE.md'

      - name: Report path detection failure
        if: steps.filter.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITLE: Test path detection unavailable
          MESSAGE: GitHub API path detection failed, so test scope was not evaluated. Rerun the workflow after the API limit or service error clears.
        with:
          script: |
            core.error(process.env.MESSAGE, { title: process.env.TITLE });
            await core.summary.addHeading(process.env.TITLE, 3).addRaw(process.env.MESSAGE).write();
            process.exitCode = 1;

  validate:
    if: ${{ !inputs.application }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ingress_status: ${{ steps.ingress-report.outputs.ingress_status }}
      ingress_log: ${{ steps.ingress-report.outputs.ingress }}
      release_status: ${{ steps.release-report.outputs.release_status }}
      release_log: ${{ steps.release-report.outputs.release }}
      automation_status: ${{ steps.automation-report.outputs.automation_status }}
      automation_log: ${{ steps.automation-report.outputs.automation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect relevant changes
        id: filter
        continue-on-error: true
        uses: dorny/paths-filter@f3360c560367c9daf72b88c0e6164162034c5721 # v4
        with:
          filters: |
            compose:
              - 'compose.yml'
              - '.env'
              - 'gateway/**'
              - '.github/tests/integration/gateway.test.js'
              - '.gitattributes'
              - '.github/workflows/ci-deploy.yml'
              - '.github/workflows/gate-test.yml'
              - '.github/workflows/ci-orchestrator.yml'
            release:
              - 'deploy/**'
              - '.github/scripts/run-release-consumer-tests.js'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.gitattributes'
              - '.github/actions/setup-uv/**'
              - '.github/workflows/gate-test.yml'
              - '.github/workflows/ci-orchestrator.yml'
            automation:
              - '.github/**'
              - '.gitattributes'
              - 'pyproject.toml'
              - 'uv.lock'

      - name: Require test scope detection
        id: scope
        env:
          OUTCOME: ${{ steps.filter.outcome }}
          COMPOSE: ${{ steps.filter.outputs.compose }}
          RELEASE: ${{ steps.filter.outputs.release }}
          AUTOMATION: ${{ steps.filter.outputs.automation }}
        shell: node {0}
        run: |
          const { OUTCOME, COMPOSE, RELEASE, AUTOMATION } = process.env;
          if (OUTCOME !== 'success' || ![COMPOSE, RELEASE, AUTOMATION].every(value => ['true', 'false'].includes(value))) {
            const message = 'Test path detection failed or returned incomplete results. Rerun after the GitHub API or service error clears.';
            console.log('::error title=Test path detection unavailable::' + message);
            require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Test path detection unavailable\n\n' + message + '\n');
            process.exitCode = 1;
          }
      - name: Test gateway topology, routes and Nginx configuration
        id: ingress
        if: steps.filter.outputs.compose == 'true'
        shell: bash
        run: node --test .github/tests/integration/gateway.test.js 2>&1 | tee "$RUNNER_TEMP/ingress.log"
      - name: Set up locked Python tooling
        if: steps.filter.outputs.release == 'true' || steps.filter.outputs.automation == 'true'
        uses: ./.github/actions/setup-uv
        with:
          project-directory: .

      - name: Test the release engine with the example application policy
        id: release-tests
        if: steps.filter.outputs.release == 'true'
        continue-on-error: true
        shell: bash
        run: node .github/scripts/run-release-consumer-tests.js 2>&1 | tee "$RUNNER_TEMP/release-tests.log"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.filter.outputs.automation == 'true'
        with:
          node-version-file: .github/package.json

      - name: Install automation dependencies
        if: steps.filter.outputs.automation == 'true'
        run: npm ci --prefix .github --ignore-scripts --no-audit --no-fund
      - name: Audit GitHub workflows and actions
        if: steps.filter.outputs.automation == 'true'
        run: node .github/scripts/validate-workflows.js --audit
      - name: Validate action-local regressions
        id: automation
        if: steps.filter.outputs.automation == 'true'
        continue-on-error: true
        shell: bash
        run: node .github/scripts/run-automation-tests.js 2>&1 | tee "$RUNNER_TEMP/automation.log"
      - id: ingress-report
        if: always()
        env:
          SCOPE: ${{ steps.scope.outcome }}
          APPLICABLE: ${{ steps.filter.outputs.compose }}
          OUTCOME: ${{ steps.ingress.outcome }}
        run: node .github/scripts/report-test-result.js ingress
      - id: release-report
        if: always()
        env:
          SCOPE: ${{ steps.scope.outcome }}
          APPLICABLE: ${{ steps.filter.outputs.release }}
          OUTCOME: ${{ steps.release-tests.outcome }}
        run: node .github/scripts/report-test-result.js release
      - id: automation-report
        if: always()
        env:
          SCOPE: ${{ steps.scope.outcome }}
          APPLICABLE: ${{ steps.filter.outputs.automation }}
          OUTCOME: ${{ steps.automation.outcome }}
        run: node .github/scripts/report-test-result.js automation
      - name: Require every applicable validation suite
        if: >-
          always() && (steps.ingress-report.outputs.ingress_status == 'failure' ||
          steps.release-report.outputs.release_status == 'failure' ||
          steps.automation-report.outcome != 'success' ||
          (steps.filter.outputs.automation == 'true' && steps.automation.outcome != 'success'))
        run: exit 1
      - name: Retain bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: infrastructure-${{ github.job }}-failure-diagnostics
          path: ${{ runner.temp }}/*.bounded.txt
          if-no-files-found: warn
          retention-days: 7

  frontend-tests:
    name: Frontend Tests (React)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subject/frontend
    steps:
      - name: Check out the workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: subject

      - name: Require a Node version in the frontend manifest
        run: jq -e '.engines.node | strings | test("\\S") and (test("[\r\n]") | not)' package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: subject/frontend/package.json
          cache: "npm"
          cache-dependency-path: "subject/frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests and production build
        id: test_run
        continue-on-error: true
        env:
          CI: true
        shell: bash
        run: node "$GITHUB_WORKSPACE/.github/scripts/run-app-checks.js" test-frontend 2>&1 | tee test_output.txt

      - name: Test summary
        id: test_summary
        if: always()
        env:
          CHECK_EXIT_CODE: ${{ steps.test_run.outcome == 'success' && '0' || '1' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/summarize-check-log.js" test_output.txt --exit-code "$CHECK_EXIT_CODE"

      - name: Retain bounded failure diagnostics
        if: always() && steps.test_summary.outputs.status != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failure-diagnostics-${{ github.job }}
          path: 'subject/**/*_output.bounded.txt'
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if tests failed
        if: steps.test_run.outcome != 'success'
        run: exit 1
    outputs:
      status: ${{ steps.test_summary.outputs.status }}
      log: ${{ steps.test_summary.outputs.log }}

  backend-tests:
    name: Backend Tests (Django)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subject/backend
    steps:
      - name: Check out the workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: subject

      - name: Set up the locked Python environment
        uses: ./.github/actions/setup-uv
        with:
          project-directory: subject/backend

      - name: Run backend tests
        id: test_run
        continue-on-error: true
        shell: bash
        run: node "$GITHUB_WORKSPACE/.github/scripts/run-app-checks.js" test-backend 2>&1 | tee test_output.txt

      - name: Test summary
        id: test_summary
        if: always()
        env:
          CHECK_EXIT_CODE: ${{ steps.test_run.outcome == 'success' && '0' || '1' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/summarize-check-log.js" test_output.txt --exit-code "$CHECK_EXIT_CODE"

      - name: Retain bounded failure diagnostics
        if: always() && steps.test_summary.outputs.status != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failure-diagnostics-${{ github.job }}
          path: 'subject/**/*_output.bounded.txt'
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if tests failed
        if: steps.test_run.outcome != 'success'
        run: exit 1
    outputs:
      status: ${{ steps.test_summary.outputs.status }}
      log: ${{ steps.test_summary.outputs.log }}

  automation-tests:
    name: Automation Tests (Node)
    needs: changes
    if: needs.changes.outputs.automation == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subject
    steps:
      - name: Check out the workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          path: subject

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: subject/frontend/package.json

      - name: Set up the locked Python environment
        uses: ./.github/actions/setup-uv
        with:
          project-directory: subject/backend
          only-dev: "true"

      - name: Install shared validation dependencies
        working-directory: .
        run: npm ci --prefix .github --ignore-scripts --no-audit --no-fund

      - name: Install verified workflow validator
        shell: bash
        run: node "$GITHUB_WORKSPACE/.github/scripts/install-actionlint.js"

      - name: Run repository automation tests
        id: test_run
        continue-on-error: true
        shell: bash
        run: node "$GITHUB_WORKSPACE/.github/scripts/run-app-checks.js" test-automation 2>&1 | tee automation_test_output.txt

      - name: Test summary
        id: test_summary
        if: always()
        shell: bash
        env:
          CHECK_EXIT_CODE: ${{ steps.test_run.outcome == 'success' && '0' || '1' }}
        run: node "$GITHUB_WORKSPACE/.github/scripts/summarize-check-log.js" automation_test_output.txt --exit-code "$CHECK_EXIT_CODE"

      - name: Retain bounded failure diagnostics
        if: always() && steps.test_summary.outputs.status != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failure-diagnostics-${{ github.job }}
          path: 'subject/**/*_output.bounded.txt'
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if tests failed
        if: steps.test_run.outcome != 'success'
        run: exit 1
    outputs:
      status: ${{ steps.test_summary.outputs.status }}
      log: ${{ steps.test_summary.outputs.log }}

  development-images:
    name: Development image builds
    needs: changes
    if: needs.changes.outputs.development == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the backend development image
        run: docker build --file backend/docker/Dockerfile.hotswap --tag batch2-backend-dev backend
      - name: Build the frontend development image
        run: docker build --file frontend/docker/Dockerfile.hotswap --tag batch2-frontend-dev frontend

  test-results:
    name: Test Results
    if: always() && inputs.application
    needs: [changes, frontend-tests, backend-tests, automation-tests, development-images]
    runs-on: ubuntu-latest
    outputs:
      frontend_status: >-
        ${{ needs.changes.outputs.frontend == 'false' && 'not-applicable' ||
            needs.changes.outputs.frontend == 'true' && needs.frontend-tests.outputs.status == 'success' && 'success' || 'failure' }}
      frontend_log: >-
        ${{ needs.changes.outputs.frontend == 'false' && 'No frontend-relevant changes.' ||
            needs.changes.outputs.frontend != 'true' && 'Unable to determine frontend scope.' ||
            needs.frontend-tests.outputs.log }}
      backend_status: >-
        ${{ needs.changes.outputs.backend == 'false' && 'not-applicable' ||
            needs.changes.outputs.backend == 'true' && needs.backend-tests.outputs.status == 'success' && 'success' || 'failure' }}
      backend_log: >-
        ${{ needs.changes.outputs.backend == 'false' && 'No backend-relevant changes.' ||
            needs.changes.outputs.backend != 'true' && 'Unable to determine backend scope.' ||
            needs.backend-tests.outputs.log }}
      automation_status: >-
        ${{ needs.changes.outputs.automation == 'false' && 'not-applicable' ||
            needs.changes.outputs.automation == 'true' && needs.automation-tests.outputs.status == 'success' && 'success' || 'failure' }}
      automation_log: >-
        ${{ needs.changes.outputs.automation == 'false' && 'No repository-automation-relevant changes.' ||
            needs.changes.outputs.automation != 'true' && 'Unable to determine automation scope.' ||
            needs.automation-tests.outputs.log }}
    steps:
      - name: Require scope detection
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Require applicable development image validation
        if: >-
          (needs.changes.outputs.development != 'true' && needs.changes.outputs.development != 'false') ||
          (needs.changes.outputs.development == 'true' && needs.development-images.result != 'success')
        run: exit 1
      - name: Require applicable frontend test result
        if: >-
          always() && needs.changes.outputs.frontend != 'false' &&
          (needs.changes.outputs.frontend != 'true' || needs.frontend-tests.outputs.status != 'success')
        run: exit 1
      - name: Require applicable backend test result
        if: >-
          always() && needs.changes.outputs.backend != 'false' &&
          (needs.changes.outputs.backend != 'true' || needs.backend-tests.outputs.status != 'success')
        run: exit 1
      - name: Require applicable automation test result
        if: >-
          always() && needs.changes.outputs.automation != 'false' &&
          (needs.changes.outputs.automation != 'true' || needs.automation-tests.outputs.status != 'success')
        run: exit 1
