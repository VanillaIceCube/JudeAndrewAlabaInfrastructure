server {
  listen 80;
  listen [::]:80;
  server_name macromapper.judeandrewalaba.com;
  return 301 https://macromapper.judeandrewalaba.com$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name macromapper.judeandrewalaba.com;
  include /etc/nginx/snippets/tls.conf;
  include /etc/nginx/snippets/headers.conf;
  set $app_backend macromapper-backend:8000;
  set $app_frontend macromapper-frontend:80;

  # The application registry decides readiness; disabled MCP returns backend 404.
  location = /mcp {
    proxy_pass http://$app_backend$request_uri;
    include /etc/nginx/snippets/mcp-transport.conf;
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/private.conf;
  }
  location ^~ /mcp/ {
    add_header Cache-Control "no-store" always;
    return 404;
  }
  location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://$app_backend$request_uri;
    include /etc/nginx/snippets/private.conf;
  }
  location = /.well-known/oauth-authorization-server {
    proxy_pass http://$app_backend$request_uri;
    include /etc/nginx/snippets/private.conf;
  }
  location ^~ /.well-known/ {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  location = /api { return 301 /api/; }
  location = /auth { return 301 /auth/; }
  location = /admin { return 301 /admin/; }
  location ~ ^/(auth|api|admin)/ {
    proxy_read_timeout 120s;
    proxy_pass http://$app_backend$request_uri;
    include /etc/nginx/snippets/private.conf;
  }
  location ~ ^/static/(admin|rest_framework)/ {
    proxy_pass http://$app_backend$request_uri;
  }
  location / {
    proxy_pass http://$app_frontend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/snippets/headers.conf;
  }
}
