# End-to-end TLS CONNECT only, to the single unchanged YNAB API authority.
# No TLS interception, credentials, disk cache or request logging.
http_port 3128
visible_hostname ynab-egress
hosts_file /etc/hosts
pid_filename /tmp/squid.pid
cache_log /dev/null
access_log none
cache_store_log none
cache deny all
cache_mem 0 MB
coredump_dir /tmp
shutdown_lifetime 1 seconds
connect_timeout 5 seconds
read_timeout 30 seconds
request_timeout 5 seconds
max_filedescriptors 256
acl connect_only method CONNECT
acl tls_port port 443
acl ynab_api dstdomain -n api.ynab.com
acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 64:ff9b:1::/48 100::/64 100:0:0:1::/64 2001::/23 2001:db8::/32 2002::/16 3fff::/20 5f00::/16 fc00::/7 fe80::/10 ff00::/8
http_access deny !connect_only
http_access deny !tls_port
http_access deny !ynab_api
http_access deny private_dst
http_access allow ynab_api connect_only tls_port
http_access deny all
