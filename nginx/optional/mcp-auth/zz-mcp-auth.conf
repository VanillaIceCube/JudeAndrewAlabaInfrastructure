# Inactive fixed authorization service; selected only by the reviewed gateway bundle.
map $request_uri $mcp_auth_exact_route {
  default 0;
  ~^/\.well-known/oauth-authorization-server$ 1;
  ~^/o/(authorize|token|revoke_token|introspect)/([?].*)?$ 1;
  ~^/o/authorized_tokens/([?].*)?$ 1;
  ~^/o/authorized_tokens/[a-zA-Z0-9_-]+/delete/([?].*)?$ 1;
  ~^/accounts/(login|logout|password_change)/([?].*)?$ 1;
  ~^/accounts/password_change/done/([?].*)?$ 1;
}
server {
  listen 80;
  listen [::]:80;
  server_name auth.judeandrewalaba.com;
  access_log off;
  add_header Cache-Control "no-store" always;
  if ($host != "auth.judeandrewalaba.com") { return 421; }
  if ($mcp_auth_exact_route = 0) { return 404; }
  return 301 https://auth.judeandrewalaba.com$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name auth.judeandrewalaba.com;
  include /etc/nginx/snippets/tls.conf;
  include /etc/nginx/snippets/headers.conf;
  include /etc/nginx/snippets/private.conf;
  access_log off;
  error_log /dev/null;
  if ($host != "auth.judeandrewalaba.com") { return 421; }
  if ($mcp_auth_exact_route = 0) { return 404; }
  client_body_timeout 5s;
  send_timeout 30s;
  proxy_connect_timeout 2s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;
  resolver_timeout 2s;
  set $mcp_auth_backend mcp-auth:8000;
  location / {
    client_max_body_size 32k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    include /etc/nginx/snippets/headers.conf;
    proxy_set_header X-API-Key "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header CF-Connecting-IP "";
    include /etc/nginx/snippets/private.conf;
    proxy_pass http://$mcp_auth_backend$request_uri;
  }
}
