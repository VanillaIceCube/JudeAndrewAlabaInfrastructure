name: Infrastructure Lint Gate
on:
  workflow_call:
    outputs:
      log:
        description: Bounded diagnostic log for Lint Eastwood.
        value: ${{ jobs.lint.outputs.log }}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  lint:
    name: Infrastructure lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      log: ${{ steps.report.outputs.log }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Set up locked Python tooling
        uses: ./.github/actions/setup-uv
      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint-1.7.12.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$archive" | sha256sum --check
          tool_dir="$RUNNER_TEMP/infrastructure-tools"
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir" actionlint
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: Validate workflow, shell, Python and JavaScript
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          bash -s <<'BASH' 2>&1 | tee "$RUNNER_TEMP/lint.log"
          set -euo pipefail
          # This release omits GitHub's Dependabot alerts permission from its scope list.
          actionlint -ignore 'unknown permission scope "vulnerability-alerts"'
          node .github/actions/check-workflow-security/check-workflow-security.js
          mapfile -t shell_files < <(git ls-files --cached --others --exclude-standard '*.sh')
          if [ "${#shell_files[@]}" -gt 0 ]; then
            shellcheck "${shell_files[@]}"
          fi
          python3 -m compileall -q nginx app-release
          while IFS= read -r source; do
            node --check "$source"
          done < <(git ls-files --cached --others --exclude-standard '*.js')
          BASH
      - name: Report diagnostics
        id: report
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/lint.log" "$GITHUB_OUTPUT" log "$LINT_OUTCOME" <<'PY'
          """Bound CI reviewer context while retaining early, failing and late evidence."""
          from pathlib import Path
          import re
          import sys
          import uuid


          def summarize(text, limit=16000):
              lines = text.splitlines()
              indexes = set(range(min(20, len(lines))))
              indexes.update(range(max(0, len(lines) - 20), len(lines)))
              failures = [i for i, line in enumerate(lines) if re.search(
                  r"not ok|FAIL(?:ED|URE)?|Traceback|AssertionError|^\s*[×✖]|Error:", line
              )]
              # Even many failures get bounded context; sample across the entire run.
              if len(failures) > 12:
                  failures = [failures[round(i * (len(failures) - 1) / 11)] for i in range(12)]
              for i in failures:
                  indexes.update(range(max(0, i - 1), min(len(lines), i + 4)))
              # Allocate a per-line budget so a huge header cannot remove later failures.
              budget = max(32, (limit - 1000) // max(1, len(indexes)))
              selected = []
              previous = -1
              for i in sorted(indexes):
                  if i > previous + 1:
                      selected.append("... omitted lines; complete output is in the job log ...")
                  selected.append(lines[i][:budget])
                  previous = i
              return "\n".join(selected)[:limit]


          def main():
              source, output = map(Path, sys.argv[1:3])
              text = source.read_text(encoding="utf-8", errors="replace") if source.exists() else "No check output was produced."
              content = summarize(text)
              name, status = sys.argv[3:] or ("log", None)
              delimiter = ("REPORT_" if status is not None else "LOG_") + uuid.uuid4().hex
              with output.open("a", encoding="utf-8") as stream:
                  if status is not None:
                      report = "\n".join(content.splitlines()[-120:])[-16000:]
                      stream.write(f"{name}_status={status}\n")
                  else:
                      report = content
                  stream.write(f"{name}<<{delimiter}\n{report}\n{delimiter}\n")
              # Artifact size is capped; tee retains the complete original in the job log.
              data = text.encode("utf-8")
              cap = 512 * 1024
              if len(data) > 2 * cap:
                  data = data[:cap] + b"\n... artifact truncated; complete output is in the job log ...\n" + data[-cap:]
              source.with_suffix(".bounded.txt").write_bytes(data)
              source.with_suffix(".summary.txt").write_text(content, encoding="utf-8", newline="\n")


          if __name__ == "__main__":
              main()
          PY
      - name: Enforce lint result
        if: steps.lint.outcome != 'success'
        run: exit 1
      - name: Retain bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: infrastructure-${{ github.job }}-failure-diagnostics
          path: ${{ runner.temp }}/*.bounded.txt
          if-no-files-found: warn
          retention-days: 7
