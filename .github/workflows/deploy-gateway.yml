name: Deploy gateway
on:
  push:
    branches: [env-prod]
  workflow_dispatch:
concurrency:
  group: gateway-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: >-
      github.repository_id == '1414122449' && github.repository_owner == 'VanillaIceCube' &&
      github.ref == 'refs/heads/env-prod' && vars.DEPLOY_ENABLED == 'true' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate reviewed source and owner authorization before loading SSH credentials
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: python3 gateway/scripts/gateway_transport.py authorize
      - name: Launch the gateway
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
        run: python3 gateway/scripts/gateway_transport.py
