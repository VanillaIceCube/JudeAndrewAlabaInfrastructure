name: Validate infrastructure
on:
  workflow_call:
    outputs:
      ingress_status:
        description: Gateway topology, routing, recovery-state and Nginx syntax check status.
        value: ${{ jobs.validate.outputs.ingress_status }}
      ingress_log:
        description: Bounded gateway validation diagnostics.
        value: ${{ jobs.validate.outputs.ingress_log }}
      recovery_status:
        description: Canonical release and recovery regression status.
        value: ${{ jobs.validate.outputs.recovery_status }}
      recovery_log:
        description: Bounded release and recovery diagnostics.
        value: ${{ jobs.validate.outputs.recovery_log }}
      automation_status:
        description: Automation regression status.
        value: ${{ jobs.validate.outputs.automation_status }}
      automation_log:
        description: Automation diagnostics.
        value: ${{ jobs.validate.outputs.automation_log }}
permissions:
  contents: read
  pull-requests: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ingress_status: ${{ steps.ingress-report.outputs.ingress_status }}
      ingress_log: ${{ steps.ingress-report.outputs.ingress }}
      recovery_status: ${{ steps.recovery-report.outputs.recovery_status }}
      recovery_log: ${{ steps.recovery-report.outputs.recovery }}
      automation_status: ${{ steps.automation-report.outputs.automation_status }}
      automation_log: ${{ steps.automation-report.outputs.automation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect relevant changes
        id: filter
        continue-on-error: true
        uses: dorny/paths-filter@f3360c560367c9daf72b88c0e6164162034c5721 # v4
        with:
          filters: |
            compose:
              - 'compose.yml'
              - '.env'
              - 'nginx/**'
              - '.github/tests/integration/gateway.test.js'
              - '.gitattributes'
              - '.github/workflows/deploy-gateway.yml'
              - '.github/workflows/gate-test.yml'
              - '.github/workflows/ci-orchestrator.yml'
            manifest:
              - 'app-release/**'
              - '.github/scripts/run-release-consumer-tests.js'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.gitattributes'
              - '.github/actions/setup-uv/**'
              - '.github/workflows/gate-test.yml'
              - '.github/workflows/ci-orchestrator.yml'
            automation:
              - '.github/**'
              - '.gitattributes'
              - 'pyproject.toml'
              - 'uv.lock'

      - name: Require test scope detection
        id: scope
        env:
          OUTCOME: ${{ steps.filter.outcome }}
          COMPOSE: ${{ steps.filter.outputs.compose }}
          MANIFEST: ${{ steps.filter.outputs.manifest }}
          AUTOMATION: ${{ steps.filter.outputs.automation }}
        shell: node {0}
        run: |
          const { OUTCOME, COMPOSE, MANIFEST, AUTOMATION } = process.env;
          if (OUTCOME !== 'success' || ![COMPOSE, MANIFEST, AUTOMATION].every(value => ['true', 'false'].includes(value))) {
            const message = 'Test path detection failed or returned incomplete results. Rerun after the GitHub API or service error clears.';
            console.log('::error title=Test path detection unavailable::' + message);
            require('node:fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Test path detection unavailable\n\n' + message + '\n');
            process.exitCode = 1;
          }
      - name: Test gateway topology, routes, recovery state and Nginx configuration
        id: ingress
        if: steps.filter.outputs.compose == 'true'
        shell: bash
        run: node --test .github/tests/integration/gateway.test.js 2>&1 | tee "$RUNNER_TEMP/ingress.log"
      - name: Set up locked Python tooling
        if: steps.filter.outputs.manifest == 'true' || steps.filter.outputs.automation == 'true'
        uses: ./.github/actions/setup-uv

      - name: Verify shared release source manifest
        if: steps.filter.outputs.manifest == 'true'
        run: python3 app-release/update_release_manifest.py --check

      - name: Check out the pinned consumer test fixture
        if: steps.filter.outputs.manifest == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: VanillaIceCube/FullStackTemplate
          ref: 5556bcbc032fe8201ffb2826e921b70a6a2767df
          path: release-consumer-fixture
          persist-credentials: false

      - name: Run canonical release and recovery tests with the consumer policy
        id: release-tests
        if: steps.filter.outputs.manifest == 'true'
        continue-on-error: true
        working-directory: release-consumer-fixture
        shell: bash
        run: node "$GITHUB_WORKSPACE/.github/scripts/run-release-consumer-tests.js" 2>&1 | tee "$RUNNER_TEMP/release-tests.log"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.filter.outputs.automation == 'true'
        with:
          node-version-file: .github/package.json

      - name: Install automation dependencies
        if: steps.filter.outputs.automation == 'true'
        run: npm ci --prefix .github --ignore-scripts --no-audit --no-fund
      - name: Audit GitHub workflows and actions
        if: steps.filter.outputs.automation == 'true'
        run: node .github/scripts/validate-workflows.js --audit
      - name: Validate action-local regressions
        id: automation
        if: steps.filter.outputs.automation == 'true'
        continue-on-error: true
        shell: bash
        run: node .github/scripts/run-automation-tests.js 2>&1 | tee "$RUNNER_TEMP/automation.log"
      - id: ingress-report
        if: always()
        env:
          SCOPE: ${{ steps.scope.outcome }}
          APPLICABLE: ${{ steps.filter.outputs.compose }}
          OUTCOME: ${{ steps.ingress.outcome }}
        run: node .github/scripts/report-test-result.js ingress
      - id: recovery-report
        if: always()
        env:
          SCOPE: ${{ steps.scope.outcome }}
          APPLICABLE: ${{ steps.filter.outputs.manifest }}
          OUTCOME: ${{ steps.release-tests.outcome }}
        run: node .github/scripts/report-test-result.js recovery
      - id: automation-report
        if: always()
        env:
          SCOPE: ${{ steps.scope.outcome }}
          APPLICABLE: ${{ steps.filter.outputs.automation }}
          OUTCOME: ${{ steps.automation.outcome }}
        run: node .github/scripts/report-test-result.js automation
      - name: Require every applicable validation suite
        if: >-
          always() && (steps.ingress-report.outputs.ingress_status == 'failure' ||
          steps.recovery-report.outputs.recovery_status == 'failure' ||
          steps.automation-report.outcome != 'success' ||
          (steps.filter.outputs.automation == 'true' && steps.automation.outcome != 'success'))
        run: exit 1
      - name: Retain bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: infrastructure-${{ github.job }}-failure-diagnostics
          path: ${{ runner.temp }}/*.bounded.txt
          if-no-files-found: warn
          retention-days: 7
