name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches-ignore:
      - env-prod
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lints:
    name: Lints
    uses: ./.github/workflows/gate-lint.yml
    with:
      application: false
    permissions:
      contents: read
      pull-requests: read
  tests:
    name: Tests
    uses: ./.github/workflows/gate-test.yml
    with:
      application: false
    permissions:
      contents: read
      pull-requests: read
  codeql:
    name: CodeQL
    uses: ./.github/workflows/alert-codeql.yml
    with:
      scan_only: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
  dependency-vulnerability:
    name: Vulnerability
    uses: ./.github/workflows/gate-vulnerability.yml
    permissions:
      contents: read
      pull-requests: read
  secrets:
    name: Secret scan
    uses: ./.github/workflows/gate-secrets.yml
  code-review:
    name: AI Code Review
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: VanillaIceCube/agent-hub/.github/workflows/review-code.yml@main
    with:
      publish: true
    secrets:
      OBI_WAN_OPENAI_API_KEY: ${{ secrets.OBI_WAN_OPENAI_API_KEY }}
      OBI_WAN_CODE_NOBI_PRIVATE_KEY: ${{ secrets.OBI_WAN_CODE_NOBI_PRIVATE_KEY }}
    permissions:
      statuses: read
      checks: read
      contents: read
      pull-requests: read
  build-review:
    name: AI Build Sheriff Review
    needs: [lints, tests]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    uses: VanillaIceCube/agent-hub/.github/workflows/review-build.yml@main
    secrets:
      LINT_EASTWOOD_OPENAI_API_KEY: ${{ secrets.LINT_EASTWOOD_OPENAI_API_KEY }}
      LINT_EASTWOOD_PRIVATE_KEY: ${{ secrets.LINT_EASTWOOD_PRIVATE_KEY }}
    permissions:
      statuses: read
      checks: read
      contents: read
      pull-requests: read
    with:
      publish: true
      lint_result: ${{ needs.lints.result }}
      test_result: ${{ needs.tests.result }}
      lint_evidence: ${{ toJSON(needs.lints.outputs) }}
      test_evidence: ${{ toJSON(needs.tests.outputs) }}

  security-review:
    name: AI Security Review
    needs: [codeql, dependency-vulnerability, secrets]
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    uses: VanillaIceCube/agent-hub/.github/workflows/review-security.yml@main
    secrets:
      ROBOCOP_OPENAI_API_KEY: ${{ secrets.ROBOCOP_OPENAI_API_KEY }}
      ROBOCOP_PRIVATE_KEY: ${{ secrets.ROBOCOP_PRIVATE_KEY }}
    permissions:
      statuses: read
      actions: read
      checks: read
      contents: read
      pull-requests: read
      security-events: read
    with:
      publish: true
      codeql_result: ${{ needs.codeql.result }}
      codeql_scope_status: ${{ needs.codeql.outputs.scope_status }}
      codeql_scope_python: ${{ needs.codeql.outputs.scope_python }}
      codeql_scope_javascript: ${{ needs.codeql.outputs.scope_javascript }}
      codeql_scope_actions: ${{ needs.codeql.outputs.scope_actions }}
      dependency_vulnerability_result: ${{ needs.dependency-vulnerability.result }}
      dependency_vulnerability_report: ${{ needs.dependency-vulnerability.outputs.vulnerability_report }}
      secret_scan_result: ${{ needs.secrets.result }}
  result:
    name: Required CI
    needs: [lints, tests, codeql, dependency-vulnerability, secrets, code-review, build-review, security-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require independent gates and applicable reviews
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: node .github/scripts/validate-ci-results.js

      - name: Verify branch rules are readable with the workflow token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/verify-branch-rules
