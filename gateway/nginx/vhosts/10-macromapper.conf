server {
  listen 80;
  listen [::]:80;
  server_name macromapper.judeandrewalaba.com;
  return 301 https://macromapper.judeandrewalaba.com$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name macromapper.judeandrewalaba.com;
  include /etc/nginx/helpers/tls.conf;
  include /etc/nginx/helpers/headers.conf;
  set $app_backend macromapper-backend:8000;
  set $app_frontend macromapper-frontend:80;
  include /etc/nginx/helpers/app-routes.conf;
  location ~ ^/(auth|api|admin)/ {
    # Meal estimates can take longer than the default upstream read timeout.
    proxy_read_timeout 120s;
    proxy_pass http://$app_backend$request_uri;
    include /etc/nginx/helpers/private-backend.conf;
  }
}
