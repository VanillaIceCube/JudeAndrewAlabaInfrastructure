name: host-ingress
services:
  proxy:
    image: nginx@sha256:f9238a4aacf18df0f059cf0389490fc2e876352f75d019f475a48e8765576f24
    container_name: host-ingress-proxy
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/vhosts:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ${INGRESS_CERTS_DIR:-/root/apps/notoli/certs}:/etc/nginx/certs:ro
    networks:
      notoli_backend:
        ipv4_address: 172.30.88.2
      notoli_frontend:
      macromapper:
        ipv4_address: 172.20.0.3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  notoli_backend:
    external: true
    name: notoli_backend_private
  notoli_frontend:
    external: true
    name: notoli_default
  macromapper:
    external: true
    name: macromapper-ingress
