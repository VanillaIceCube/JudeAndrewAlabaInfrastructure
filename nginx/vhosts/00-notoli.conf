server {
  listen 80;
  listen [::]:80;
  server_name notoli.judeandrewalaba.com;
  return 301 https://notoli.judeandrewalaba.com$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name notoli.judeandrewalaba.com;
  include /etc/nginx/snippets/tls.conf;
  include /etc/nginx/snippets/headers.conf;
  set $app_backend notoli-backend:8000;
  set $app_frontend notoli-frontend:80;

  location = /mcp {
    proxy_pass http://$app_backend$request_uri;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_set_header Connection "";
    # A local proxy_set_header cancels inheritance of ALL parent headers.
    include /etc/nginx/snippets/headers.conf;
    include /etc/nginx/snippets/private.conf;
  }
  location ^~ /.well-known/ {
    proxy_pass http://$app_backend$request_uri;
  }

  location = /api { return 301 /api/; }
  location = /auth { return 301 /auth/; }
  location = /admin { return 301 /admin/; }
  location ~ ^/(auth|api|admin)/ {
    proxy_pass http://$app_backend$request_uri;
    include /etc/nginx/snippets/private.conf;
  }
  location ~ ^/static/(admin|rest_framework)/ {
    proxy_pass http://$app_backend$request_uri;
  }
  location / {
    proxy_pass http://$app_frontend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/snippets/headers.conf;
  }
}
