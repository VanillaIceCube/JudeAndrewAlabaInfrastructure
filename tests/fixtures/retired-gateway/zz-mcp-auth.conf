# Keep this hostname contained through service recovery and database migrations.
server {
  listen 80;
  listen [::]:80;
  server_name auth.judeandrewalaba.com;
  access_log off;
  add_header Cache-Control "no-store" always;
  return 410;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name auth.judeandrewalaba.com;
  include /etc/nginx/snippets/tls.conf;
  access_log off;
  error_log /dev/null;
  add_header Cache-Control "no-store" always;
  return 410;
}
