name: CodeQL Alert

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      scan_only:
        description: Run only the full CodeQL scan
        type: boolean
        default: false
  workflow_call:
    inputs:
      scan_only:
        description: Run the scanner without reconciling tickets.
        type: boolean
        default: true
      languages_in_tree:
        description: Scan the languages present in the checkout on every run.
        type: boolean
        default: false
    outputs:
      scope_status:
        description: Whether path-aware CodeQL scope detection succeeded.
        value: ${{ jobs.changes.outputs.scope_status }}
      scope_python:
        description: Whether the pull request requires Python analysis.
        value: ${{ jobs.changes.outputs.python }}
      scope_javascript:
        description: Whether the pull request requires JavaScript/TypeScript analysis.
        value: ${{ jobs.changes.outputs.javascript }}
      scope_actions:
        description: Whether the pull request requires GitHub Actions analysis.
        value: ${{ jobs.changes.outputs.actions }}

concurrency:
  # Ticket reconciliation has its own queue, independent of scan-only runs.
  group: codeql-${{ github.workflow }}-${{ github.ref }}-${{ inputs.scan_only && 'scan' || github.run_id }}
  cancel-in-progress: ${{ inputs.scan_only == true }}

permissions: {}

jobs:
  changes:
    name: Detect CodeQL Scope
    if: github.event_name == 'schedule' || inputs.scan_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scope_status: ${{ steps.scope.outputs.scope_status }}
      python: ${{ steps.scope.outputs.python }}
      javascript: ${{ steps.scope.outputs.javascript }}
      actions: ${{ steps.scope.outputs.actions }}
    steps:
      - name: Check out the workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Install locked workflow dependencies
        run: npm ci --prefix .github --ignore-scripts --no-audit --no-fund

      - name: Verify atomic immutable CodeQL revisions
        run: node .github/scripts/validate-workflows.js --check-codeql-pins

      - name: Check out the repository for language detection
        if: inputs.languages_in_tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: subject
          persist-credentials: false

      - name: Detect relevant changes
        id: filter
        if: github.event_name == 'pull_request' && !inputs.languages_in_tree
        continue-on-error: true
        uses: dorny/paths-filter@f3360c560367c9daf72b88c0e6164162034c5721 # v4
        with:
          filters: |
            python:
              - 'backend/**'
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/tests/**'
              - '.github/package.json'
              - '.github/package-lock.json'
              - '.github/workflows/**'
              - '.github/codeql/**'
            javascript:
              - 'frontend/**'
              - '**/*.js'
              - '**/*.cjs'
              - '**/*.mjs'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.cts'
              - '**/*.mts'
              - '**/*.tsx'
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/tests/**'
              - '.github/package.json'
              - '.github/package-lock.json'
              - '.github/workflows/**'
              - '.github/codeql/**'
            actions:
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/tests/**'
              - '.github/package.json'
              - '.github/package-lock.json'
              - '.github/workflows/**'
              - '.github/codeql/**'

      - name: Report path detection failure
        if: github.event_name == 'pull_request' && !inputs.languages_in_tree && steps.filter.outcome != 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITLE: CodeQL path detection unavailable
          MESSAGE: GitHub API path detection failed, so CodeQL scope was not evaluated. Rerun the workflow after the API limit or service error clears.
        with:
          script: |
            core.error(process.env.MESSAGE, { title: process.env.TITLE });
            await core.summary.addHeading(process.env.TITLE, 3).addRaw(process.env.MESSAGE).write();
            process.exitCode = 1;

      - name: Set analysis scope
        id: scope
        env:
          LANGUAGES_IN_TREE: ${{ inputs.languages_in_tree }}
          EVENT_NAME: ${{ github.event_name }}
          PYTHON_SCOPE: ${{ steps.filter.outputs.python }}
          JAVASCRIPT_SCOPE: ${{ steps.filter.outputs.javascript }}
          ACTIONS_SCOPE: ${{ steps.filter.outputs.actions }}
        run: node .github/scripts/set-codeql-scope.js

  analyze-python:
    name: ${{ inputs.languages_in_tree && 'Analyze python' || 'Analyze Python' }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: python
          # GitHub's security-and-quality suite includes security-extended: https://docs.github.com/en/code-security/concepts/code-scanning/codeql/codeql-query-suites
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:python"

  analyze-javascript:
    name: ${{ inputs.languages_in_tree && 'Analyze javascript-typescript' || 'Analyze JavaScript/TypeScript' }}
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:javascript-typescript"

  analyze-actions:
    name: ${{ inputs.languages_in_tree && 'Analyze actions' || 'Analyze GitHub Actions' }}
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: actions
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:actions"

  aggregate:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !inputs.scan_only
    concurrency: security-alerts-codeql
    permissions:
      contents: read
    uses: VanillaIceCube/agent-hub/.github/workflows/triage-security.yml@13e83c67970ac9dcde3c5688dedd60384abeba3e # AgentHub, 2026-11-27
    with:
      feed: codeql
      publish: true
    secrets:
      ROBOCOP_PRIVATE_KEY: ${{ secrets.ROBOCOP_PRIVATE_KEY }}
      ROBOCOP_OPENAI_API_KEY: ${{ secrets.ROBOCOP_OPENAI_API_KEY }}
