name: ynab-mcp
services:
  runtime:
    profiles: [manual-stdio]
    image: ${YNAB_RUNTIME_REPOSITORY:?Set the reviewed registry repository}@sha256:${YNAB_RUNTIME_SHA256:?Set the reviewed 64-character manifest digest}
    user: "65532:65532"
    init: true
    restart: "no"
    stdin_open: true
    tty: false
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0700
    environment:
      YNAB_API_TOKEN_FILE: /run/secrets/ynab_api_token
      YNAB_ALLOW_WRITES: "0"
      YNAB_DISABLE_AGENT_CONFIG_FALLBACK: "1"
    secrets: [ynab_api_token]
    logging:
      driver: none
secrets:
  ynab_api_token:
    file: ${YNAB_TOKEN_FILE:?Set an operator-owned private token-file path}
