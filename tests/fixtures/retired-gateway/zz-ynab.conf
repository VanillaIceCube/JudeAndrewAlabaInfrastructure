# Explicit tombstone for a separately approved disable/recovery gateway release.
# The hostname must never fall through into Notoli's default vhost during disablement.
server {
  listen 80;
  listen [::]:80;
  server_name ynab.judeandrewalaba.com;
  access_log off;
  add_header Cache-Control "no-store" always;
  return 410;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name ynab.judeandrewalaba.com;
  include /etc/nginx/snippets/tls.conf;
  access_log off;
  error_log /dev/null;
  add_header Cache-Control "no-store" always;
  return 410;
}
