name: Validate infrastructure
on:
  workflow_call:
    outputs:
      ingress_status:
        description: Gateway topology, routing, recovery-state and Nginx syntax check status.
        value: ${{ jobs.validate.outputs.ingress_status }}
      ingress_log:
        description: Bounded gateway validation diagnostics.
        value: ${{ jobs.validate.outputs.ingress_log }}
      recovery_status:
        description: Canonical release and recovery regression status.
        value: ${{ jobs.validate.outputs.recovery_status }}
      recovery_log:
        description: Bounded release and recovery diagnostics.
        value: ${{ jobs.validate.outputs.recovery_log }}
      automation_status:
        description: Automation regression status.
        value: ${{ jobs.validate.outputs.automation_status }}
      automation_log:
        description: Automation diagnostics.
        value: ${{ jobs.validate.outputs.automation_log }}
permissions:
  contents: read
  pull-requests: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOUNDED_LOG_PYTHON: |
        """Bound CI reviewer context while retaining early, failing and late evidence."""
        from pathlib import Path
        import re
        import sys
        import uuid


        def summarize(text, limit=16000):
            lines = text.splitlines()
            indexes = set(range(min(20, len(lines))))
            indexes.update(range(max(0, len(lines) - 20), len(lines)))
            failures = [i for i, line in enumerate(lines) if re.search(
                r"not ok|FAIL(?:ED|URE)?|Traceback|AssertionError|^\s*[×✖]|Error:", line
            )]
            # Even many failures get bounded context; sample across the entire run.
            if len(failures) > 12:
                failures = [failures[round(i * (len(failures) - 1) / 11)] for i in range(12)]
            for i in failures:
                indexes.update(range(max(0, i - 1), min(len(lines), i + 4)))
            # Allocate a per-line budget so a huge header cannot remove later failures.
            budget = max(32, (limit - 1000) // max(1, len(indexes)))
            selected = []
            previous = -1
            for i in sorted(indexes):
                if i > previous + 1:
                    selected.append("... omitted lines; complete output is in the job log ...")
                selected.append(lines[i][:budget])
                previous = i
            return "\n".join(selected)[:limit]


        def main():
            source, output = map(Path, sys.argv[1:3])
            text = source.read_text(encoding="utf-8", errors="replace") if source.exists() else "No check output was produced."
            content = summarize(text)
            name, status = sys.argv[3:] or ("log", None)
            delimiter = ("REPORT_" if status is not None else "LOG_") + uuid.uuid4().hex
            with output.open("a", encoding="utf-8") as stream:
                if status is not None:
                    report = "\n".join(content.splitlines()[-120:])[-16000:]
                    stream.write(f"{name}_status={status}\n")
                else:
                    report = content
                stream.write(f"{name}<<{delimiter}\n{report}\n{delimiter}\n")
            # Artifact size is capped; tee retains the complete original in the job log.
            data = text.encode("utf-8")
            cap = 512 * 1024
            if len(data) > 2 * cap:
                data = data[:cap] + b"\n... artifact truncated; complete output is in the job log ...\n" + data[-cap:]
            source.with_suffix(".bounded.txt").write_bytes(data)
            source.with_suffix(".summary.txt").write_text(content, encoding="utf-8", newline="\n")


        if __name__ == "__main__":
            main()
    outputs:
      ingress_status: ${{ steps.ingress-report.outputs.ingress_status }}
      ingress_log: ${{ steps.ingress-report.outputs.ingress }}
      recovery_status: ${{ steps.recovery-report.outputs.recovery_status }}
      recovery_log: ${{ steps.recovery-report.outputs.recovery }}
      automation_status: ${{ steps.automation-report.outputs.automation_status }}
      automation_log: ${{ steps.automation-report.outputs.automation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect relevant changes
        id: filter
        continue-on-error: true
        uses: dorny/paths-filter@f3360c560367c9daf72b88c0e6164162034c5721 # v4
        with:
          filters: |
            compose:
              - 'compose.yml'
              - 'nginx/**'
              - '.gitattributes'
              - '.github/workflows/deploy-gateway.yml'
              - '.github/workflows/gate-test.yml'
              - '.github/workflows/ci-orchestrator.yml'
            manifest:
              - 'app-release/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.gitattributes'
              - '.github/actions/setup-uv/**'
              - '.github/workflows/gate-test.yml'
              - '.github/workflows/ci-orchestrator.yml'
            automation:
              - '.github/**'
              - '.gitattributes'
              - 'pyproject.toml'
              - 'uv.lock'

      - name: Require test scope detection
        id: scope
        env:
          OUTCOME: ${{ steps.filter.outcome }}
          COMPOSE: ${{ steps.filter.outputs.compose }}
          MANIFEST: ${{ steps.filter.outputs.manifest }}
          AUTOMATION: ${{ steps.filter.outputs.automation }}
        shell: bash
        run: |
          if [[ "$OUTCOME" = success && "$COMPOSE" =~ ^(true|false)$ && "$MANIFEST" =~ ^(true|false)$ && "$AUTOMATION" =~ ^(true|false)$ ]]; then
            exit 0
          fi
          message="Test path detection failed or returned incomplete results. Rerun after the GitHub API or service error clears."
          echo "::error title=Test path detection unavailable::$message"
          printf '### Test path detection unavailable\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Validate Compose configuration
        id: compose
        if: steps.filter.outputs.compose == 'true'
        run: |
          set -o pipefail
          docker compose -f compose.yml config --quiet 2>&1 | tee "$RUNNER_TEMP/compose.log"

      - name: Test gateway topology, routes, recovery state and Nginx configuration
        id: ingress
        if: steps.filter.outputs.compose == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export INGRESS_CERTS_DIR
          INGRESS_CERTS_DIR=$(mktemp -d "$RUNNER_TEMP/ingress-certs.XXXXXX")
          openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=ci.invalid -days 1 \
            -keyout "$INGRESS_CERTS_DIR/origin.key" -out "$INGRESS_CERTS_DIR/origin.pem" 2>/dev/null
          docker compose -f compose.yml config --format json > "$RUNNER_TEMP/ingress-compose.json"
          PYTHONPATH=nginx python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/ingress.log"
          import copy
          import json
          import os
          import tempfile
          from pathlib import Path
          from unittest import TestCase
          import gateway_release as gateway

          repo = Path.cwd()
          model = json.loads((Path(os.environ["RUNNER_TEMP"]) / "ingress-compose.json").read_text())
          certs = os.environ["INGRESS_CERTS_DIR"]
          gateway.validate_gateway_compose(model, certs)
          wrong_proxy = copy.deepcopy(model)
          wrong_proxy["services"]["proxy"]["networks"]["macromapper"]["ipv4_address"] = "172.20.0.99"
          with TestCase().assertRaisesRegex(gateway.ReleaseError, "Proxy trust/address drift"):
              gateway.validate_gateway_compose(wrong_proxy, certs)

          state = gateway.retired_route_state(repo, model)
          gateway.retired_route_state(repo, model, state)
          with TestCase().assertRaises(gateway.ReleaseError):
              gateway.retired_route_state(repo, model, dict(state, profile="unexpected"))

          vhosts = [p.read_text() for p in (repo / "nginx/vhosts").glob("*.conf")]
          for app in ("notoli", "macromapper"):
              configured = [v for v in vhosts if f"server_name {app}.judeandrewalaba.com;" in v]
              if len(configured) != 1:
                  raise ValueError(f"Expected one {app} vhost")
              for directive in (f"set $app_backend {app}-backend:8000;", f"set $app_frontend {app}-frontend:80;",
                                "proxy_pass http://$app_backend$request_uri;", "proxy_pass http://$app_frontend$request_uri;"):
                  if directive not in configured[0]:
                      raise ValueError(f"Missing {app} routing directive: {directive}")

          with tempfile.TemporaryDirectory() as folder:
              root = Path(folder)
              for name in ("releases", "attempts", "incoming"):
                  (root / name).mkdir(mode=0o700)
              gateway.ensure_image(model["services"]["proxy"]["image"])
              gateway.Gateway(root).syntax(model)
          print("Passed gateway addresses and listeners, app routes, recovery-state checks and isolated nginx -t.")
          PY

      - name: Set up locked Python tooling
        if: steps.filter.outputs.manifest == 'true' || steps.filter.outputs.automation == 'true'
        uses: ./.github/actions/setup-uv

      - name: Verify shared release source manifest
        if: steps.filter.outputs.manifest == 'true'
        run: python3 app-release/update_release_manifest.py --check

      - name: Check out the pinned consumer test fixture
        if: steps.filter.outputs.manifest == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: VanillaIceCube/FullStackTemplate
          ref: 5556bcbc032fe8201ffb2826e921b70a6a2767df
          path: release-consumer-fixture
          persist-credentials: false

      - name: Run canonical release and recovery tests with the consumer policy
        id: release-tests
        if: steps.filter.outputs.manifest == 'true'
        continue-on-error: true
        working-directory: release-consumer-fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/production/build_bundle.py --check-parity --source-root "$GITHUB_WORKSPACE" --sync
          cd deploy/tests
          shopt -s nullglob
          modules=()
          for canonical in "$GITHUB_WORKSPACE"/app-release/v1/tests/test_*.py; do
            filename=${canonical##*/}
            cmp -- "$canonical" "$filename"
            modules+=("${filename%.py}")
          done
          (( ${#modules[@]} > 0 )) || { echo "Missing canonical release tests"; exit 1; }
          python3 -m unittest -v "${modules[@]}" 2>&1 | tee "$RUNNER_TEMP/release-tests.log"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.filter.outputs.automation == 'true'
        with:
          node-version: '24'

      - name: Validate action-local regressions
        id: automation
        if: steps.filter.outputs.automation == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            shopt -s globstar nullglob dotglob
            automation_tests=(.github/actions/**/*.test.js)
            if [ "${#automation_tests[@]}" -eq 0 ]; then
              echo "No GitHub action regression tests were found." >&2
              exit 1
            fi
            node --test "${automation_tests[@]}"
          } 2>&1 | tee "$RUNNER_TEMP/automation.log"
      - name: Bound Compose diagnostics
        if: always() && (steps.compose.outcome == 'success' || steps.compose.outcome == 'failure')
        shell: bash
        run: python3 - "$RUNNER_TEMP/compose.log" "$RUNNER_TEMP/compose.outputs" <<< "$BOUNDED_LOG_PYTHON"
      - id: ingress-report
        if: always()
        env:
          SCOPE: ${{ steps.scope.outcome }}
          APPLICABLE: ${{ steps.filter.outputs.compose }}
          OUTCOME: ${{ steps.ingress.outcome }}
        shell: bash
        run: |
          if [[ "$SCOPE" == success && "$APPLICABLE" == false ]]; then
            echo 'ingress_status=not-applicable' >> "$GITHUB_OUTPUT"
            echo 'ingress=No gateway or ingress check changes.' >> "$GITHUB_OUTPUT"
          elif [[ "$OUTCOME" == success || "$OUTCOME" == failure ]]; then
            python3 - "$RUNNER_TEMP/ingress.log" "$GITHUB_OUTPUT" ingress "$OUTCOME" <<< "$BOUNDED_LOG_PYTHON"
          else
            echo 'ingress_status=failure' >> "$GITHUB_OUTPUT"
            echo 'ingress=Gateway regression checks did not run. Check scope and prerequisites.' >> "$GITHUB_OUTPUT"
          fi
      - id: recovery-report
        if: always()
        env:
          SCOPE: ${{ steps.scope.outcome }}
          APPLICABLE: ${{ steps.filter.outputs.manifest }}
          OUTCOME: ${{ steps.release-tests.outcome }}
        shell: bash
        run: |
          if [[ "$SCOPE" == success && "$APPLICABLE" == false ]]; then
            echo 'recovery_status=not-applicable' >> "$GITHUB_OUTPUT"
            echo 'recovery=No release source or test gate changes.' >> "$GITHUB_OUTPUT"
          elif [[ "$OUTCOME" == success || "$OUTCOME" == failure ]]; then
            python3 - "$RUNNER_TEMP/release-tests.log" "$GITHUB_OUTPUT" recovery "$OUTCOME" <<< "$BOUNDED_LOG_PYTHON"
          else
            echo 'recovery_status=failure' >> "$GITHUB_OUTPUT"
            echo 'recovery=Release and recovery tests did not run. Check scope and prerequisites.' >> "$GITHUB_OUTPUT"
          fi
      - id: automation-report
        if: always()
        env:
          SCOPE: ${{ steps.scope.outcome }}
          AUTOMATION: ${{ steps.filter.outputs.automation }}
          OUTCOME: ${{ steps.automation.outcome }}
        shell: bash
        run: |
          if [ "$SCOPE" != success ]; then
            echo 'automation_status=failure' >> "$GITHUB_OUTPUT"
            echo 'automation=Unable to determine which checks apply.' >> "$GITHUB_OUTPUT"
          elif [ "$AUTOMATION" = false ]; then
            echo 'automation_status=not-applicable' >> "$GITHUB_OUTPUT"
            echo 'automation=No GitHub automation or tooling changes.' >> "$GITHUB_OUTPUT"
          elif [ "$OUTCOME" = success ] || [ "$OUTCOME" = failure ]; then
            python3 - "$RUNNER_TEMP/automation.log" "$GITHUB_OUTPUT" automation "$OUTCOME" <<< "$BOUNDED_LOG_PYTHON"
          else
            echo 'automation_status=failure' >> "$GITHUB_OUTPUT"
            echo 'automation=Action regressions did not run. Check the preceding validation and setup steps.' >> "$GITHUB_OUTPUT"
          fi
      - name: Require every applicable validation suite
        if: >-
          always() && (steps.ingress-report.outputs.ingress_status == 'failure' ||
          steps.recovery-report.outputs.recovery_status == 'failure' ||
          steps.automation-report.outcome != 'success' ||
          (steps.filter.outputs.automation == 'true' && steps.automation.outcome != 'success'))
        run: exit 1
      - name: Retain bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: infrastructure-${{ github.job }}-failure-diagnostics
          path: ${{ runner.temp }}/*.bounded.txt
          if-no-files-found: warn
          retention-days: 7
